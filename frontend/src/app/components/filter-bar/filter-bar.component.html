<div class="filter-bar">
  <input type="text"
         class="search-input"
         placeholder="Search trails..."
         [(ngModel)]="searchTerm"
         (input)="emitChange()">
  <div class="pills">
    <button *ngFor="let d of difficulties"
            class="pill"
            [class.active]="selectedDifficulty === d"
            (click)="selectDifficulty(d)">
      {{ d }}
    </button>
  </div>
</div>
